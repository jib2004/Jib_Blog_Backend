[project]
name = "jib-blog-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
        "flask>=3.0",
    "flask-sqlalchemy>=3.0",
    "flask-cors>=4.0",
    "python-dotenv>=1.0",
    "flask-session>=0.8",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "coverage>=7.0",
]